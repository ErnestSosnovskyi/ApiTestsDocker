name: CRM Test Automation & Reports

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Tests Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Test Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Clone and Start CRM Application
        run: |
          git clone https://github.com/dreamquality/employee-management-crm.git ../crm
          cd ../crm
          
          cat << 'EOF' > .env
          NODE_ENV=development
          PORT=3000
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=crm_db
          DB_USER=postgres
          DB_PASSWORD=postgres
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=crm_db
          JWT_SECRET=supersecretjwtkey12345
          SECRET_WORD=supersecretword12345
          CORS_ORIGIN=*
          VITE_API_URL=http://localhost:3000
          EOF

          sed -i 's/\r$//' entrypoint.sh entrypoint-test.sh 2>/dev/null || true

          docker compose --profile dev up -d --build

      - name: Wait for CRM Services to be Ready
        run: |
          echo "Waiting for Backend API (port 3000)..."
          timeout 120s bash -c 'until curl -s http://localhost:3000/health > /dev/null || curl -s http://localhost:3000 > /dev/null; do sleep 3; done' || true
          
          echo "Waiting for Frontend UI (port 5173)..."
          timeout 120s bash -c 'until curl -s http://localhost:5173 > /dev/null; do sleep 3; done' || true
          
          cd ../crm && docker compose --profile dev ps

      - name: Run Playwright Tests
        env:
          BASE_API_URL: http://localhost:3000
          BASE_UI_URL: http://localhost:5173
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: adminpassword
        run: npx playwright test        

      - name: Generate Allure Report
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'allure-report'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4